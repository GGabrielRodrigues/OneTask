{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneTask - Seu Gerenciador Pessoal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* ===== TEMA TOKYONIGHT ===== */
        :root {
            --tn-bg: #1a1b26;
            --tn-bg-dark: #16161e;
            --tn-card: #24283b;
            --tn-border: #414868;
            --tn-text: #c0caf5;
            --tn-text-muted: #565f89;
            --tn-primary: #7aa2f7;
            --tn-pink: #f7768e;
            --tn-green: #9ece6a;
            --tn-orange: #ff9e64;
            --tn-cyan: #7dcfff;
        }

        body {
            background-color: var(--tn-bg);
            color: var(--tn-text);
        }

        h1, h2, h3, h4, h5, h6 { color: var(--tn-text); }

        /* Navbar */
        .navbar {
            background-color: var(--tn-bg-dark) !important;
            border-bottom: 1px solid var(--tn-border);
        }
        .navbar-brand {
            font-weight: bold;
            color: var(--tn-primary) !important;
            text-shadow: 0 0 8px rgba(122, 162, 247, 0.4);
        }
        .nav-link-custom {
            color: var(--tn-text-muted) !important;
            text-decoration: none;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .nav-link-custom:hover, .nav-link-custom.active {
            color: var(--tn-primary) !important;
            background-color: rgba(122, 162, 247, 0.1);
        }

        /* Cards and Modals */
        .card, .modal-content {
            background-color: var(--tn-card) !important;
            border: 1px solid var(--tn-border) !important;
            color: var(--tn-text);
        }
        .card-header, .modal-header {
            background-color: var(--tn-bg-dark) !important;
            border-bottom: 1px solid var(--tn-border) !important;
            color: var(--tn-text);
        }
        .modal-title { color: var(--tn-text); }
        .btn-close { filter: invert(1) grayscale(100%) brightness(200%); }

        /* Inputs & Tables */
        .form-control, .form-select {
            background-color: var(--tn-bg) !important;
            border: 1px solid var(--tn-border) !important;
            color: var(--tn-text) !important;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 0.25rem rgba(122, 162, 247, 0.25) !important;
            border-color: var(--tn-primary) !important;
        }
        .form-control::placeholder, .form-select::placeholder {
            color: var(--tn-text-muted) !important;
            opacity: 0.7;
        }
        .table { color: var(--tn-text); }
        .table-light th {
            background-color: var(--tn-bg-dark) !important;
            color: var(--tn-text) !important;
            border-bottom: 1px solid var(--tn-border) !important;
        }
        .table tbody tr td {
            background-color: var(--tn-card) !important;
            border-bottom: 1px solid var(--tn-border);
            color: var(--tn-text);
        }
        .table-hover tbody tr:hover td {
            background-color: var(--tn-border) !important;
        }

        /* Buttons */
        .btn-primary {
            background-color: var(--tn-primary);
            border-color: var(--tn-primary);
            color: var(--tn-bg);
            box-shadow: 0 0 10px rgba(122, 162, 247, 0.4);
        }
        .btn-primary:hover { background-color: #688be0; border-color: #688be0; color: var(--tn-bg); }
        .btn-outline-primary { color: var(--tn-primary); border-color: var(--tn-primary); }
        .btn-outline-primary:hover {
            background-color: var(--tn-primary); color: var(--tn-bg);
            box-shadow: 0 0 10px rgba(122, 162, 247, 0.4);
        }
        .btn-outline-danger { color: var(--tn-pink); border-color: var(--tn-pink); }
        .btn-outline-danger:hover {
            background-color: var(--tn-pink); color: var(--tn-bg);
            box-shadow: 0 0 10px rgba(247, 118, 142, 0.4);
        }
        .btn-outline-secondary { color: var(--tn-text-muted); border-color: var(--tn-border); }
        .btn-outline-secondary:hover { background-color: var(--tn-border); color: var(--tn-text); }
        .btn-danger { background-color: var(--tn-pink); border-color: var(--tn-pink); box-shadow: 0 0 10px rgba(247, 118, 142, 0.4); }
        .btn-dark { background-color: var(--tn-bg-dark); border-color: var(--tn-border); color: var(--tn-text); }

        /* Overrides */
        .bg-primary { background-color: var(--tn-primary) !important; }
        .bg-success { background-color: var(--tn-green) !important; color: var(--tn-bg-dark) !important; }
        .bg-danger  { background-color: var(--tn-pink) !important; }
        .bg-warning { background-color: var(--tn-orange) !important; color: var(--tn-bg-dark) !important; }
        .bg-dark    { background-color: var(--tn-bg-dark) !important; border: 1px solid var(--tn-border); }
        .text-dark   { color: var(--tn-bg-dark) !important; }
        .text-white  { color: #ffffff !important; }
        .text-secondary, .text-muted, .form-text { color: var(--tn-text-muted) !important; }

        /* List group */
        .list-group-item {
            background-color: var(--tn-bg);
            border-color: var(--tn-border);
            color: var(--tn-text);
        }

        /* ===== MODAL TABS (FIX) ===== */
        .modal .nav-tabs {
            border-bottom: 1px solid var(--tn-border);
        }
        .modal .nav-tabs .nav-link {
            color: var(--tn-text-muted);
            background-color: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            border-radius: 0;
            padding: 0.6rem 1rem;
            transition: all 0.2s;
        }
        .modal .nav-tabs .nav-link:hover {
            color: var(--tn-text);
            border-bottom-color: var(--tn-border);
        }
        .modal .nav-tabs .nav-link.active {
            color: var(--tn-primary) !important;
            background-color: transparent !important;
            border-bottom: 2px solid var(--tn-primary);
        }

        /* ===== KANBAN BOARD ===== */
        .kanban-board {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding-bottom: 1rem;
            min-height: 70vh;
        }
        .kanban-column {
            min-width: 280px;
            max-width: 280px;
            background-color: var(--tn-bg-dark);
            border: 1px solid var(--tn-border);
            border-radius: 12px;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            transition: background-color 0.2s;
        }
        .kanban-column.drag-over {
            background-color: rgba(122, 162, 247, 0.08);
            border-color: var(--tn-primary);
        }
        .kanban-column-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.25rem 0.75rem;
            border-bottom: 1px solid var(--tn-border);
            margin-bottom: 0.25rem;
        }
        .kanban-column-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .kanban-column-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--tn-text);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .kanban-column-count {
            margin-left: auto;
            font-size: 0.75rem;
            color: var(--tn-text-muted);
            background-color: var(--tn-border);
            border-radius: 20px;
            padding: 0 0.5rem;
        }
        .kanban-card {
            background-color: var(--tn-card);
            border: 1px solid var(--tn-border);
            border-radius: 8px;
            padding: 0.75rem;
            cursor: grab;
            transition: box-shadow 0.2s, transform 0.15s, border-color 0.2s;
            user-select: none;
        }
        .kanban-card:active { cursor: grabbing; }
        .kanban-card:hover {
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border-color: var(--tn-primary);
            transform: translateY(-2px);
        }
        .kanban-card.dragging {
            opacity: 0.4;
            transform: rotate(2deg);
        }
        .kanban-card-title {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--tn-text);
            margin-bottom: 0.4rem;
        }
        .kanban-card-meta {
            font-size: 0.75rem;
            color: var(--tn-text-muted);
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .kanban-card-due {
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            background-color: rgba(122, 162, 247, 0.15);
            color: var(--tn-cyan);
        }
        .kanban-card-due.overdue {
            background-color: rgba(247, 118, 142, 0.15);
            color: var(--tn-pink);
        }
        .kanban-drop-zone {
            min-height: 60px;
            border-radius: 8px;
            transition: background-color 0.2s;
            flex: 1;
        }
        .kanban-drop-zone.drag-over {
            background-color: rgba(122, 162, 247, 0.06);
        }
    </style>
</head>
<body>
    <!-- Barra de Navegação -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'dashboard' %}">
                <img src="{% static 'core/images/logo.png' %}" alt="OneTask Logo" width="36" height="36" style="border-radius: 8px;">
                OneTask
            </a>
            {% if user.is_authenticated %}
            <div class="d-flex align-items-center gap-2">
                <a href="{% url 'dashboard' %}" class="nav-link-custom {% block nav_dashboard %}{% endblock %}">
                    <i class="bi bi-list-task me-1"></i>Lista
                </a>
                <a href="{% url 'kanban_board' %}" class="nav-link-custom {% block nav_kanban %}{% endblock %}">
                    <i class="bi bi-kanban me-1"></i>Kanban
                </a>
                <a href="{% url 'status_list' %}" class="nav-link-custom {% block nav_status %}{% endblock %}">
                    <i class="bi bi-tags me-1"></i>Status
                </a>
                <span class="text-muted mx-2" style="font-size:0.8rem;">|</span>
                <span class="text-muted" style="font-size:0.85rem;">{{ user.username }}</span>
                <form action="{% url 'logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger btn-sm">Sair</button>
                </form>
            </div>
            {% endif %}
        </div>
    </nav>

    <!-- Área de Conteúdo Principal -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
